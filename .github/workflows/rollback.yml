name: Restore website release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Finalized sites/glob2-website-pharaoh-418820/versions/ID from hosting-release artifact'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: website-production
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    environment: website
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          project_id: pharaoh-418820
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/promote-static.py --version "$VERSION"
